name: Escaner diario metodo Cava

on:
  schedule:
    # 21:30 UTC de lunes a viernes = 23:30 en Madrid (verano) / 22:30 (invierno),
    # después del cierre de Wall Street. GitHub puede retrasarlo unos minutos.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  escaner:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar escaner
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python run.py

      - name: Guardar informe en el repositorio
        run: |
          git config user.name "escaner-bot"
          git config user.email "escaner-bot@users.noreply.github.com"
          git add reports universe
          git commit -m "Informe $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
