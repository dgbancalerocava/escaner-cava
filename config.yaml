# ============================================================
#  Configuración del escáner "Método Cava"
#  Puedes cambiar cualquier valor desde la web de GitHub
#  (abre este archivo y pulsa el lápiz para editar).
# ============================================================

# Listas de valores a analizar (carpeta universe/)
universos:
  - indices.csv        # Semáforo de mercado (S&P 500, Nasdaq, IBEX...)
  - sp500.csv
  - nasdaq100.csv
  - ibex35.csv
  - europe_tech.csv
  - etfs.csv

# Años de histórico diario a descargar (5 = suficiente para MACD mensual)
anios_historico: 5

# Filtro de liquidez: volumen medio diario en dinero (moneda local), 20 sesiones
liquidez_minima: 2000000

# --- 1. CONTEXTO (tendencia de fondo) -------------------------
contexto:
  macd_semanal_sobre_cero: true     # MACD semanal > 0
  exigir_macd_mensual_alcista: false # true = además MACD mensual > su señal
  precio_sobre_media_200: true      # cierre > media 200 sesiones
  rsi_impulso_minimo: 60            # el tramo previo llevó el RSI(14) diario a >= este valor
  adx_minimo: 20                    # ADX(14) máximo de las últimas 30 sesiones >= este valor

# --- 2. ALERTA (la corrección madura) -------------------------
alerta:
  estocastico_lento_max: 30   # estocástico 50 u 89 ha bajado de este nivel...
  ventana_estocastico: 10     # ...en las últimas N sesiones
  retroceso_min: 0.382        # o el retroceso del último tramo es >= 38,2 %
  retroceso_max: 0.786        # por encima de esto la tendencia se considera dañada

# --- 3. ESTRUCTURA DE LA CORRECCIÓN ---------------------------
estructura:
  ventana_maximo: 60          # busca el techo del tramo en las últimas N sesiones
  min_sesiones_correccion: 3  # la corrección debe durar al menos N sesiones
  ventana_pivote: 3           # velas a cada lado para considerar un pivote (máximo/mínimo)
  ratio_tiempo_max: 2.618     # corrección / tramo > 2,618 => posible agotamiento

# --- 4. TRAMPA / BARRIDA ("sin trampa no compro") -------------
trampa:
  ventana: 15                 # la barrida debe haberse producido en las últimas N sesiones
  sesiones_recuperacion: 3    # tiempo máximo para volver a cerrar por encima del mínimo barrido
  volumen_manos_fuertes: 1.3  # volumen >= 1,3x la media de 20 sesiones cuenta como "manos fuertes"
  exigir_volumen: false       # true = sin volumen alto no se acepta la trampa

# --- 5. DISPARO Y GESTIÓN ------------------------------------
disparo:
  sesiones_ruptura_reciente: 3  # ruptura de directriz en las últimas N sesiones sigue siendo válida
  volumen_ruptura: 1.2          # volumen en la ruptura para puntuar extra
  margen_stop_atr: 0.25         # stop = mínimo de la barrida - 0,25 ATR
  rr_minimo: 3.0                # relación riesgo/recompensa mínima (1:3)
  riesgo_max_pct: 12            # descarta operaciones con stop a más del 12 % de la entrada

# Gestión monetaria opcional: si pones capital > 0 calcula nº de acciones
capital: 0
riesgo_por_operacion_pct: 1.0

# Informe
informe:
  max_graficos: 12            # gráficos adjuntos en el email (señales + trampas)
  max_vigilancia: 25          # nº máximo de valores "en vigilancia" que se listan
  max_por_estado: 30          # nº máximo de señales / trampas listadas (ordenadas por puntuación)
